spring.application.name=lanterne
# Les erreurs au format standard (RFC 9457, ProblemDetail).
spring.mvc.problemdetails.enabled=true
# Le transporteur (un service externe, parfois lent, parfois en panne).
lanterne.transporteur.url=${TRANSPORTEUR_URL:http://localhost:8099}
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
# Le disjoncteur du transporteur : sur 20 appels (10 au minimum), 50 % d'échecs ou d'appels lents (> 2 s) l'ouvrent
# pendant 30 secondes.
resilience4j.circuitbreaker.instances.transporteur.register-health-indicator=true
resilience4j.circuitbreaker.instances.transporteur.sliding-window-size=20
resilience4j.circuitbreaker.instances.transporteur.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.transporteur.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.transporteur.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.transporteur.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.transporteur.wait-duration-in-open-state=30s
