spring.application.name=lanterne
# Les erreurs au format standard (RFC 9457, ProblemDetail).
spring.mvc.problemdetails.enabled=true
# La base : par défaut celle de ta machine ; dans un conteneur, donne DB_URL (et DB_USER, DB_PASSWORD).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lanterne}
spring.datasource.username=${DB_USER:lanterne}
spring.datasource.password=${DB_PASSWORD:lanterne}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
