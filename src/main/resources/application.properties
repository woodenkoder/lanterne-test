spring.application.name=lanterne
# Les erreurs au format standard (RFC 9457, ProblemDetail).
spring.mvc.problemdetails.enabled=true
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.jpa.open-in-view=false
# Acquittement après traitement (AUTO) ; 3 essais, puis la file des messages en échec (pas de remise en file).
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=200ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false
