spring.application.name=lanterne
# Les erreurs au format standard (RFC 9457, ProblemDetail).
spring.mvc.problemdetails.enabled=true
# La base locale (docker compose). Le schéma vient des migrations Flyway, jamais de Hibernate.
spring.datasource.url=jdbc:postgresql://localhost:5432/lanterne
spring.datasource.username=lanterne
spring.datasource.password=${DB_PASSWORD:lanterne}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
