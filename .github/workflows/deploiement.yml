# Le déploiement : sur un tag v* (git tag v1.2.0 && git push origin v1.2.0), on teste, on construit l'image et on la
# publie sur ghcr.io avec le nom du tag. Rien ne part sur un simple push.
name: Déploiement

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
